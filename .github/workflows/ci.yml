name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Builds and tests run inside scripts/sandbox containers; the runner only needs Docker.
      - name: Cache sandbox packages
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: .sandbox-cache
          key: sandbox-${{ hashFiles('platform/**/packages.lock.json', 'extractors/ts/package-lock.json', 'platform/src/CapabilityExplorer.Explorer/client/package-lock.json', 'fixtures/src/**/*.csproj', 'fixtures/src/**/package-lock.json') }}
      - name: Audit action dependencies
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/actions-audit audit
      - name: Pull sandbox images
        run: |
          for image in mcr.microsoft.com/dotnet/sdk:10.0 node:22-bookworm postgres:17-alpine; do
            if [ "${ACT:-}" != "true" ] || ! docker image inspect "$image" >/dev/null 2>&1; then
              docker pull "$image"
            fi
          done
      - run: make ci
