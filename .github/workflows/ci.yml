name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require main as the PR target
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE: ${{ github.base_ref }}
        run: |
          test "$PR_BASE" = main || {
            echo 'PRs must target main; other merge destinations are prohibited.' >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Builds and tests run inside scripts/sandbox containers; the runner only needs Docker.
      - name: Cache sandbox packages
        if: ${{ !env.ACT }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .sandbox-cache/nuget
            .sandbox-cache/nuget-http
            .sandbox-cache/npm
            .sandbox-cache/trivy
            .sandbox-cache/tools
          key: sandbox-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/runtime/images.env', 'scripts/sandbox', 'config/build/sandbox.mk', 'platform/**/packages.lock.json', 'platform/**/*.csproj', 'platform/**/*.props', 'platform/**/NuGet.Config', 'extractors/ts/package.json', 'extractors/ts/package-lock.json', 'platform/src/CapabilityExplorer.Explorer/client/package.json', 'platform/src/CapabilityExplorer.Explorer/client/package-lock.json', 'spikes/likec4/package.json', 'spikes/likec4/package-lock.json', 'fixtures/src/**/*.csproj', 'fixtures/src/**/package.json', 'fixtures/src/**/package-lock.json') }}
      - name: Audit action dependencies
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/actions-audit audit
      - name: Pull sandbox images
        run: |
          source config/runtime/images.env
          for image in "$DOTNET_IMAGE" "$NODE_IMAGE" "$PG_IMAGE"; do
            if [ "${ACT:-}" != "true" ] || ! docker image inspect "$image" >/dev/null 2>&1; then
              docker pull "$image"
            fi
          done
      - run: make EXECUTION=sandbox ci
