name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: platform/**/packages.lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            extractors/ts/package-lock.json
            platform/src/CapabilityExplorer.Explorer/client/package-lock.json
      - name: Audit action dependencies
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/actions-audit audit
      - run: make ci
